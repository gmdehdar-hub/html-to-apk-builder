name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fix Project
        run: |
          rm -f app/src/main/res/drawable/app_icon.svg
          find . -name "app_icon.svg" -delete
          ls -la
          if [ -f "./html-to-apk-builder/gradlew" ]; then
            echo "Moving files from subfolder to root"
            mv ./html-to-apk-builder/* ./
            rm -rf ./html-to-apk-builder
          fi
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
